name: 🐞 Bug report
title: '[bug] '
description: Something in ZapTerm doesn't work as it should
labels: ['bug']

body:
  - type: markdown
    attributes:
      value: |
        Please search the [existing issues](https://github.com/CarlosTejeiro/ZapTerm/issues?q=is%3Aissue)
        first. Never paste passwords, keys or private host names.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead. Screenshots help.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Version and system
      description: ZapTerm version (Help → About), operating system, and the protocol/device involved.
      placeholder: 'ZapTerm 1.0.1 · Windows 11 · SSH to a Cisco IOS-XE switch'
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      render: text
